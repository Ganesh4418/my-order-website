<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WineKart — Order Online{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}"><span class="brand-icon">M</span> WineKart</a>
  <nav><a href="{{ url_for('home') }}">Product</a><a class="cart-link" href="{{ url_for('cart') }}">Order <span class="count">{{ cart_count }}</span></a></nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="messages">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<footer><p>Order directly from our store. <span>© 2026 WineKart</span></p></footer>
</body>
</html>
